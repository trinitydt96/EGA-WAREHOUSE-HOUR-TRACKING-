<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2426">
<title>EGA Labor — My Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2426; --ink-2:#4A5557; --alu:#DCE0DF; --panel:#F5F7F6; --line:#B9C1C0;
  --glass:#2F6F68; --glass-soft:#D7E8E4; --orange:#E8641B; --steel:#5E7482; --red:#B3261E;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--alu);color:var(--ink);font:16px/1.4 var(--body);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header h1{font:700 22px/1 var(--cond);margin:0}
header h1 span{color:var(--glass-soft);font-weight:500}
#sync{font:600 14px/1 var(--cond);padding:6px 10px;border-radius:14px;background:#2d393b;white-space:nowrap}
#sync.ok{background:var(--glass)} #sync.wait{background:var(--orange)} #sync.bad{background:var(--red)}
main{max-width:560px;margin:0 auto;padding:14px 14px 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:15px}
select,input,textarea{width:100%;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:18px}
textarea{min-height:64px;resize:vertical;font-size:16px}
select:invalid,select.empty{color:#7c8789}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font:600 19px/1.2 var(--cond);margin:22px 2px 8px;color:var(--ink-2)}

/* a task block */
.block{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--glass);border-radius:6px 10px 10px 6px;padding:12px 14px;display:grid;gap:10px;margin-bottom:10px}
.block.bad{border-left-color:var(--red)}
.block.idle{border-left-color:var(--line)}
.block.idle .hrs{color:#9aa5a6}
.opt{font:500 13px var(--body);color:var(--ink-2);margin-left:6px}
.req{font:600 12px/1 var(--cond);background:var(--orange);color:#fff;border-radius:8px;padding:3px 7px;margin-left:6px;vertical-align:1px}
select.need{border:2px solid var(--red)}
.clear{border:0;background:none;color:var(--ink-2);text-decoration:underline;font-size:14px;padding:0;justify-self:start;cursor:pointer}
.bhead{display:flex;justify-content:space-between;align-items:center}
.bhead b{font:700 19px/1 var(--cond)}
.bhead .hrs{font:700 22px/1 var(--cond);color:var(--glass);font-variant-numeric:tabular-nums}
.block.bad .hrs{color:var(--red)}
.rm{border:0;background:none;color:var(--red);font:600 15px var(--cond);padding:4px 0 4px 12px;cursor:pointer}
.cat{display:inline-block;font:600 13px/1 var(--cond);padding:4px 8px;border-radius:10px;margin-left:6px}
.cat.Production{background:var(--glass-soft);color:var(--glass)} .cat.Support{background:#E1E7EA;color:var(--steel)} .cat.Lost{background:#F6DCDA;color:var(--red)}
.msg{font-size:14px;color:var(--red);font-weight:600}

.btn{min-height:52px;border-radius:8px;padding:0 16px;font:600 18px/1 var(--cond);letter-spacing:.02em;cursor:pointer;background:#fff;border:1px solid var(--line);width:100%}
.btn.add{border-style:dashed;background:transparent}
.btn.go{background:var(--glass);color:#fff;border-color:var(--glass);min-height:62px;font-size:22px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:#fff;border-radius:10px;padding:14px 16px;margin:14px 0}
.total span{font-size:15px;color:#c9d2d3}
.total b{font:700 34px/1 var(--cond);font-variant-numeric:tabular-nums}

/* done screen */
.done{background:var(--panel);border:1px solid var(--line);border-top:10px solid var(--glass);border-radius:10px;padding:22px 18px;display:grid;gap:14px;text-align:center}
.done .check{width:64px;height:64px;border-radius:50%;background:var(--glass);color:#fff;display:grid;place-items:center;margin:0 auto;font:700 38px/1 var(--cond)}
.done h3{margin:0;font:700 28px/1.1 var(--cond)}
.done .big{font:700 46px/1 var(--cond);color:var(--glass)}
.done ul{list-style:none;margin:0;padding:0;text-align:left;border-top:1px solid var(--line)}
.done li{display:grid;grid-template-columns:1fr auto;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.done li b{font:600 17px var(--cond)} .done li span{color:var(--ink-2);grid-column:1}
.done li .h{grid-row:1/3;grid-column:2;font:700 19px var(--cond);align-self:center}
.state{font-weight:600;font-size:15px}
.state.wait{color:var(--orange)} .state.ok{color:var(--glass)}
.link{border:0;background:none;color:var(--ink-2);text-decoration:underline;font-size:15px;cursor:pointer;padding:8px}

.modal{position:fixed;inset:0;background:rgba(28,36,38,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:92vh;overflow:auto}
.sheet h3{margin:0;font:700 24px/1.1 var(--cond)}
.sheet ul{list-style:none;margin:0;padding:0}
.sheet li{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sheet li b{font:600 17px var(--cond)} .sheet li .h{grid-row:1/3;grid-column:2;font:700 19px var(--cond);align-self:center}
.warn{background:#FBEFD0;color:#7a4f00;border-radius:8px;padding:10px 12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>EGA Labor <span>my hours</span></h1>
  <div id="sync">Loading…</div>
</header>

<main>
  <!-- ===== FORM ===== -->
  <div id="formView">
    <div class="card">
      <label><span>Your name <span class="req">Required</span></span>
        <select id="worker" required></select>
      </label>
      <label>Day worked
        <select id="date"></select>
      </label>
    </div>

    <h2>What you worked on <span style="font:400 14px var(--body)">(fill in only the tasks you did)</span></h2>
    <div id="blocks"></div>

    <div class="total"><span id="totalNote">Total hours</span><b id="total">0.00</b></div>

    <div class="card">
      <label><span>Notes <span style="font-weight:400;color:var(--ink-2)">(optional)</span></span>
        <textarea id="notes" placeholder="Anything the office should know"></textarea>
      </label>
      <button class="btn go" id="reviewBtn" type="button">Submit my hours</button>
    </div>

    <h2>Sent from this phone</h2>
    <div class="card" id="history" style="gap:0;padding:4px 14px"></div>
  </div>

  <!-- ===== DONE ===== -->
  <div id="doneView" hidden>
    <div class="done">
      <div class="check" aria-hidden="true">✓</div>
      <h3 id="doneTitle">Done for today</h3>
      <div><div class="big" id="doneHours">0.00</div><div style="color:var(--ink-2)">hours submitted</div></div>
      <ul id="doneList"></ul>
      <div class="state" id="doneState"></div>
      <button class="btn dark" id="nextWorker" type="button">Next worker</button>
      <button class="link" id="addMore" type="button">Forgot something? Add more hours for this day</button>
    </div>
  </div>
</main>

<div class="modal" id="reviewModal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
  <div class="sheet">
    <h3 id="reviewTitle">Check your hours</h3>
    <div id="reviewWho" style="color:var(--ink-2)"></div>
    <ul id="reviewList"></ul>
    <div class="total" style="margin:0"><span>Total</span><b id="reviewTotal"></b></div>
    <div class="warn" id="reviewWarn" hidden></div>
    <button class="btn go" id="submitBtn" type="button">Submit</button>
    <button class="btn" id="editBtn" type="button">Go back and fix</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== paste your Apps Script /exec URL here (same one in board.html) ===== */
var WH = 'PASTE_WEB_APP_URL_HERE';

const K = k => 'egaLabor_' + k;
const load = (k, d) => { try { const v = localStorage.getItem(K(k)); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(K(k), JSON.stringify(v)); } catch (e) {} };
let lists = load('lists', { workers: [], projects: [], stations: [] });
let queue = load('queue', []);        // submissions waiting to reach the sheet
let done  = load('done', {});         // "worker|date" -> [submission, ...] made on this phone
let last  = load('last', {});         // last worker + project, to pre-fill
let device = load('device', null);
if (!device) { device = 'D' + Math.random().toString(36).slice(2, 7).toUpperCase(); save('device', device); }
let blocks = [];
let connected = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const mins = t => { const p = t.split(':'); return +p[0] * 60 + +p[1]; };
const tLabel = t => { const m = mins(t), h = Math.floor(m / 60); return ((h % 12) || 12) + ':' + pad(m % 60) + (h >= 12 ? ' PM' : ' AM'); };
const dLabel = s => new Date(s + 'T00:00').toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
const newId = p => p + device + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();
const catClass = c => (c || '').startsWith('Lost') ? 'Lost' : (c || 'Production');
const blockHrs = b => (b.start && b.end && mins(b.end) > mins(b.start)) ? (mins(b.end) - mins(b.start)) / 60 : 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

/* time choices: every 30 min, 4:00 AM – 11:30 PM */
const TIMES = []; for (let m = 4 * 60; m < 24 * 60; m += 30) TIMES.push(pad(Math.floor(m / 60)) + ':' + pad(m % 60));

/* ---------- lists ---------- */
async function fetchLists() {
  if (WH.includes('PASTE')) { connected = false; renderSync(); return; }
  try {
    const j = await (await fetch(WH + '?action=lists')).json();
    if (j.ok) { lists = j.lists; save('lists', lists); connected = true; renderTop(); renderBlocks(); }
    else connected = false;
  } catch (e) { connected = false; }
  renderSync();
}
function options(items, value, placeholder, labelFn) {
  return '<option value="">' + placeholder + '</option>' +
    items.map(i => '<option value="' + esc(i) + '"' + (i === value ? ' selected' : '') + '>' + esc(labelFn ? labelFn(i) : i) + '</option>').join('');
}
function renderTop() {
  const w = $('#worker').value || last.worker || '';
  $('#worker').innerHTML = lists.workers.length ? options(lists.workers.map(x => x.name), w, 'Tap to pick your name')
    : '<option value="">Connect once to load names</option>';
  const d = $('#date').value || ymd(new Date()), days = [];
  for (let i = 0; i < 7; i++) { const x = new Date(); x.setDate(x.getDate() - i); days.push(ymd(x)); }
  $('#date').innerHTML = days.map((s, i) => '<option value="' + s + '"' + (s === d ? ' selected' : '') + '>' +
    (i === 0 ? 'Today, ' : i === 1 ? 'Yesterday, ' : '') + dLabel(s) + '</option>').join('');
  markEmpty();
}
function markEmpty() { document.querySelectorAll('select').forEach(s => s.classList.toggle('empty', !s.value)); }
const stationsFor = p => lists.stations.filter(s => s.projects === 'All' || (Array.isArray(s.projects) && s.projects.includes(p)));

/* ---------- 5 fixed task rows ---------- */
const ROWS = 5;
function emptyRows(startAt) {
  return Array.from({ length: ROWS }, (_, i) => ({ project: i === 0 ? (last.project || '') : '', station: '', start: i === 0 ? (startAt || '07:00') : '', end: '' }));
}
const used = b => !!(b.project || b.station || b.end);   // a start time alone (pre-filled) doesn't count
const usedRows = () => blocks.filter(used);
function renderBlocks() {
  $('#blocks').innerHTML = blocks.map((b, i) => {
    const st = stationsFor(b.project), s = lists.stations.find(x => x.name === b.station);
    const h = blockHrs(b), u = used(b), bad = b.start && b.end && !h;
    return '<div class="block' + (u ? '' : ' idle') + (bad ? ' bad' : '') + '" data-i="' + i + '">' +
      '<div class="bhead"><b>' + (i + 1) + '. Task' + (i ? '<span class="opt">optional</span>' : '') +
      (s ? '<span class="cat ' + catClass(s.category) + '">' + esc(s.category) + '</span>' : '') + '</b>' +
      '<span class="hrs">' + (h ? h.toFixed(2) + ' hrs' : '–') + '</span></div>' +
      '<label>Project<select data-f="project">' + options(lists.projects.map(p => p.name), b.project, 'Pick project') + '</select></label>' +
      '<label>Station<select data-f="station">' + options(st.map(x => x.name), b.station, b.project ? 'Pick station' : 'Pick project first') + '</select></label>' +
      '<div class="two"><label>Start time<select data-f="start">' + options(TIMES, b.start, 'Start', tLabel) + '</select></label>' +
      '<label>End time<select data-f="end">' + options(TIMES, b.end, 'End', tLabel) + '</select></label></div>' +
      (bad ? '<div class="msg">End time has to be after start time.</div>' : '') +
      (u ? '<button class="clear" data-clear="' + i + '" type="button">Clear this task</button>' : '') + '</div>';
  }).join('');
  renderTotal(); markEmpty();
}
function renderTotal() {
  const t = usedRows().reduce((a, b) => a + blockHrs(b), 0);
  $('#total').textContent = t.toFixed(2);
  const w = lists.workers.find(x => x.name === $('#worker').value);
  $('#totalNote').textContent = w ? 'Total hours (usual day ' + w.std + ')' : 'Total hours';
}
$('#blocks').addEventListener('change', e => {
  const el = e.target, card = el.closest('[data-i]'); if (!card || !el.dataset.f) return;
  const i = +card.dataset.i, b = blocks[i]; b[el.dataset.f] = el.value;
  if (el.dataset.f === 'project') { if (!stationsFor(b.project).some(s => s.name === b.station)) b.station = ''; if (i === 0) { last.project = b.project; save('last', last); } }
  if (el.dataset.f === 'end' && blocks[i + 1] && !used(blocks[i + 1])) blocks[i + 1].start = el.value; // next task starts where this one ended
  renderBlocks();
});
$('#blocks').addEventListener('click', e => {
  const c = e.target.closest('[data-clear]'); if (!c) return;
  const i = +c.dataset.clear;
  blocks[i] = { project: '', station: '', start: i === 0 ? '07:00' : (blocks[i - 1].end || ''), end: '' };
  renderBlocks();
});

/* ---------- check + submit ---------- */
function problems() {
  if (!$('#worker').value) { $('#worker').classList.add('need'); window.scrollTo(0, 0); return 'Pick your name first. It’s required.'; }
  if (!usedRows().length) return 'Fill in task 1: project, station, start and end.';
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i], n = 'Task ' + (i + 1);
    if (!used(b)) continue;
    if (!b.project) return n + ': pick a project.';
    if (!b.station) return n + ': pick a station.';
    if (!b.start || !b.end) return n + ': pick a start and end time.';
    if (!blockHrs(b)) return n + ': end time has to be after start time.';
  }
  const s = blocks.map((b, i) => ({ i, u: used(b), a: mins(b.start || '00:00'), z: mins(b.end || '00:00') })).filter(x => x.u).sort((x, y) => x.a - y.a);
  for (let k = 1; k < s.length; k++) if (s[k].a < s[k - 1].z) return 'Task ' + (s[k].i + 1) + ' overlaps task ' + (s[k - 1].i + 1) + '. Fix the times.';
  // overlap with anything already submitted for this day on this phone
  const prev = (done[$('#worker').value + '|' + $('#date').value] || []).flatMap(x => x.entries);
  for (const b of usedRows()) for (const p of prev)
    if (mins(b.start) < mins(p.end) && mins(b.end) > mins(p.start)) return tLabel(b.start) + '–' + tLabel(b.end) + ' overlaps hours you already submitted (' + tLabel(p.start) + '–' + tLabel(p.end) + ').';
  return '';
}
function openReview() {
  const p = problems(); if (p) { toast(p); return; }
  const w = $('#worker').value, t = usedRows().reduce((a, b) => a + blockHrs(b), 0);
  const std = (lists.workers.find(x => x.name === w) || {}).std || 8;
  const prevT = (done[w + '|' + $('#date').value] || []).reduce((a, s) => a + s.total, 0);
  $('#reviewWho').textContent = w + ', ' + dLabel($('#date').value);
  $('#reviewList').innerHTML = usedRows().sort((a, b) => mins(a.start) - mins(b.start)).map(b =>
    '<li><b>' + esc(b.station) + '</b><span class="h">' + blockHrs(b).toFixed(2) + '</span><span>' + esc(b.project) + ', ' + tLabel(b.start) + ' – ' + tLabel(b.end) + '</span></li>').join('');
  $('#reviewTotal').textContent = t.toFixed(2) + ' hrs';
  const all = t + prevT, warn = $('#reviewWarn');
  warn.hidden = Math.abs(all - std) < 0.01;
  warn.textContent = all < std ? 'That’s ' + all.toFixed(2) + ' hrs for the day, less than your usual ' + std + '. Submit anyway if that’s right.'
    : 'That’s ' + all.toFixed(2) + ' hrs for the day, more than your usual ' + std + '. Submit anyway if that’s right.';
  $('#reviewModal').classList.add('on');
}
function submitDay() {
  const w = $('#worker').value, date = $('#date').value, info = lists.workers.find(x => x.name === w) || {};
  const sub = {
    id: newId('S'), worker: w, crew: info.crew || '', date, submitted: new Date().toISOString(),
    notes: $('#notes').value.trim(), device,
    entries: usedRows().sort((a, b) => mins(a.start) - mins(b.start)).map(b => {
      const p = lists.projects.find(x => x.name === b.project) || {}, s = lists.stations.find(x => x.name === b.station) || {};
      return { id: newId('E'), project: b.project, job: p.job || '', station: b.station, category: s.category || '', start: b.start, end: b.end };
    })
  };
  sub.total = sub.entries.reduce((a, e) => a + (mins(e.end) - mins(e.start)) / 60, 0);
  const key = w + '|' + date;
  (done[key] = done[key] || []).push(sub); pruneDone(); save('done', done);
  last.worker = w; save('last', last);
  queue.push({ type: 'submit', submission: sub }); save('queue', queue);
  $('#reviewModal').classList.remove('on');
  showDone(key); flush();
}
function pruneDone() { // keep 21 days on the phone
  const cut = new Date(); cut.setDate(cut.getDate() - 21); const c = ymd(cut);
  Object.keys(done).forEach(k => { if (k.split('|')[1] < c) delete done[k]; });
}

/* ---------- screens ---------- */
function showForm(keepWorker) {
  if (!keepWorker) $('#worker').value = '';
  const key = $('#worker').value + '|' + $('#date').value, prev = (done[key] || []).flatMap(s => s.entries);
  const lastEnd = prev.length ? prev.map(e => e.end).sort().pop() : null;
  blocks = emptyRows(lastEnd);
  $('#notes').value = '';
  $('#doneView').hidden = true; $('#formView').hidden = false;
  renderBlocks(); renderHistory(); markEmpty(); window.scrollTo(0, 0);
}
function showDone(key) {
  const subs = done[key] || []; if (!subs.length) return showForm(true);
  const [w, d] = key.split('|'), entries = subs.flatMap(s => s.entries).sort((a, b) => mins(a.start) - mins(b.start));
  const isToday = d === ymd(new Date());
  $('#doneTitle').textContent = w + ', done for ' + (isToday ? 'today' : dLabel(d));
  $('#doneHours').textContent = subs.reduce((a, s) => a + s.total, 0).toFixed(2);
  $('#doneList').innerHTML = entries.map(e => '<li><b>' + esc(e.station) + '</b><span class="h">' + ((mins(e.end) - mins(e.start)) / 60).toFixed(2) + '</span><span>' +
    esc(e.project) + ', ' + tLabel(e.start) + ' – ' + tLabel(e.end) + '</span></li>').join('');
  renderDoneState(key);
  $('#formView').hidden = true; $('#doneView').hidden = false; window.scrollTo(0, 0);
}
function renderDoneState(key) {
  if ($('#doneView').hidden && key === undefined) return;
  key = key || ($('#worker').value + '|' + $('#date').value);
  const ids = new Set(queue.map(q => q.submission.id)), waiting = (done[key] || []).some(s => ids.has(s.id));
  const el = $('#doneState');
  el.className = 'state ' + (waiting ? 'wait' : 'ok');
  el.textContent = waiting ? 'Saved on this phone. It will send when there’s signal. You can close the app.' : 'Sent to the office.';
}
function checkDone() {
  const key = $('#worker').value + '|' + $('#date').value;
  if ($('#worker').value && done[key] && done[key].length) showDone(key);
  else { renderTotal(); markEmpty(); }
}
function renderHistory() {
  const ids = new Set(queue.map(q => q.submission.id));
  const subs = Object.values(done).flat().sort((a, b) => b.submitted.localeCompare(a.submitted)).slice(0, 12);
  $('#history').innerHTML = subs.length ? subs.map(s =>
    '<div style="display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px">' +
    '<b style="font:600 17px var(--cond)">' + esc(s.worker) + '</b><b style="font:700 18px var(--cond);text-align:right">' + s.total.toFixed(2) + ' h</b>' +
    '<span style="color:var(--ink-2)">' + dLabel(s.date) + ', ' + s.entries.length + ' task' + (s.entries.length > 1 ? 's' : '') + '</span>' +
    '<span style="text-align:right;font-weight:600;color:' + (ids.has(s.id) ? 'var(--orange)">waiting' : 'var(--glass)">sent') + '</span></div>').join('')
    : '<p style="color:var(--ink-2);margin:10px 0">Nothing submitted from this phone yet.</p>';
}

/* ---------- sync ---------- */
let flushing = false;
async function flush() {
  if (flushing || !queue.length || !navigator.onLine || WH.includes('PASTE')) { renderSync(); return; }
  flushing = true;
  const batch = queue.slice(0, 20); let ok = false;
  try {
    const r = await fetch(WH, { method: 'POST', body: JSON.stringify({ events: batch }) });
    const j = await r.json(); ok = !!j.ok; connected = ok;
  } catch (e) { ok = false; connected = false; }
  if (ok) { const sent = new Set(batch.map(b => b.submission.id)); queue = queue.filter(q => !sent.has(q.submission.id)); save('queue', queue); }
  flushing = false; renderSync(); renderHistory(); if (!$('#doneView').hidden) renderDoneState();
  if (ok && queue.length) flush();
}
function renderSync() {
  const s = $('#sync');
  if (WH.includes('PASTE')) { s.className = 'bad'; s.textContent = 'Set WH URL'; return; }
  if (queue.length) { s.className = 'wait'; s.textContent = queue.length + ' waiting' + (navigator.onLine ? '' : ', offline'); return; }
  if (connected === false) { s.className = 'bad'; s.textContent = navigator.onLine ? 'Can’t reach sheet' : 'Offline'; return; }
  s.className = 'ok'; s.textContent = 'All sent';
}

/* ---------- events ---------- */
$('#worker').addEventListener('change', () => { $('#worker').classList.toggle('need', !$('#worker').value); checkDone(); });
$('#date').addEventListener('change', () => { if (!$('#doneView').hidden) showForm(true); checkDone(); });
$('#reviewBtn').addEventListener('click', openReview);
$('#submitBtn').addEventListener('click', submitDay);
$('#editBtn').addEventListener('click', () => $('#reviewModal').classList.remove('on'));
$('#nextWorker').addEventListener('click', () => { $('#date').value = ymd(new Date()); showForm(false); });
$('#addMore').addEventListener('click', () => showForm(true));
window.addEventListener('online', flush);
window.addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });

/* ---------- boot ---------- */
pruneDone(); save('done', done);
renderTop(); showForm(true); checkDone(); renderSync();
fetchLists().then(() => { checkDone(); flush(); });
setInterval(flush, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
